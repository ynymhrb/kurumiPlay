    「让光荣的纳萨力克吃下败仗的你，有什么资格请求安兹大人！太不识相了！」
    ……「还不退——」不过，雅儿贝德的怒吼被一道男子的平静声音打断，就此烟消云散。
    「——别这样，雅儿贝德。」主人重述相同的话，安抚惊呼的雅儿贝德。
    ……「你倒是说说话——」让雅儿贝德住嘴的不是说话声，而是碰撞声。那是一道手杖敲地的高亢声音。
    「雅儿贝德，安静点。是我在问科塞特斯，别太放肆了。」
    「非常抱歉！请、请原谅我！」雅儿贝德低头道歉，回到刚才所在的位置。
