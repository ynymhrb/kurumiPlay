  下次继续提取时：
  1. 先读本文件，选一个 status=pending 且 priority 高的 cluster
  2. 只对 source 文件做该 cluster line_range 范围的定点 Read（不要整篇读取或重新grep）
  3. 提取完成后：在对应 cluster 更新 status=done，填入 ceu_ids
  4. 更新 progress_summary 和 next_recommended
  5. 新CEU写入 characters/雅儿贝德/CEU/ 下对应的 yaml 文件（可按 cluster 或按章节命名）
