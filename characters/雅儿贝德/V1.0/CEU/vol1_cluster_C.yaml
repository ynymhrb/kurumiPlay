  schema_gap: >
    这条CEU的value_conflict在"追求亲密"这一段几乎不存在真正的内在冲突/权衡——她没有表现出
    "该不该"的挣扎，直接是无保留的欣然配合。现有schema把value_conflict当作CEU的核心字段之一
    （标准里"回答人物在冲突/压力下做出了什么选择"），但这条证据的关键价值恰恰在于"她在这类情境下
    没有表现出冲突"，这本身就是一个值得记录的发现（对MM3"战略化的爱"的场合模型是潜在反例或细化），
    但用"value_conflict"字段名去装"没有冲突"这件事，字段名和内容有点错位，建议schema-reviewer
    评估要不要在这类"值得注意的无冲突"情况下有更贴切的记录方式。

