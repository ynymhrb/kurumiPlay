- event_id: YLDB-V3-F-002
  raw_text: >
    「那么，请好好说个清楚吧？……你为什么会答应这件事呢？」
    ……「这是安兹大人的决定啊？我们这些下人如何反对……」
    「——为什么？……而且，你应该知道安兹大人在说谎吧？」
    ……「因为几天前的安兹大人和现在的安兹大人，简直像是完全不同的两个人。」
    ……「如果……安兹大人有什么三长两短，你要辞掉守护者总管的职位。」
    「……迪米乌哥斯，你竟敢要求雅儿贝德大人辞掉无上至尊们决定的守护者总管职位，这实在太不敬了！」
    雅儿贝德对感到吃惊的科塞特斯露出微笑。
    「没问题。不过迪米乌哥斯，若是安兹大人平安归来，今后遇到相同的情况时，你要乖乖听从我的命令。」
    ……「你有何保证可以如此断定！」……「相信主人吧，这也是我们身为被创造者的本分。」
    ……「那么，科塞特斯，你认为安兹大人的胜算有多少？」
    科塞特斯无奈地告诉两人自己的判断。「三成对七成，安兹大人是三成。」
    ……但雅儿贝德就不同了，听到这句话后依然露出的灿烂微笑中，带着游刃有余的十足把握。
