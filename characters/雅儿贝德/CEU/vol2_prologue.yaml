- event_id: YLDB-V2-P-001
  raw_text: >
    原本想命令她别再说些无谓的奉承话，但是安兹把话吞了回去。可以看见雅儿贝德斜眼注视通红双眼因为兴奋变得混浊的夏提雅，笑容逐渐出现变化。
    微笑还是不变，美貌也没有半点失色，但是那已经不能说是笑容。是有如恶鬼的容颜。
    不过安兹松了一口气。因为雅儿贝德瞪视的对象是夏提雅，而非安兹。
    「那么你已经心满意足了吧。可以退下了，夏提雅。现在我和安兹大人正在商讨纳萨力克地下大坟墓的未来，可以别来打扰我们两人处理重要事务吗？」
    （第二卷.txt 第65-69行）
