schema_version: spec/event_schema.md v1.0
note: >
  圣王国卷（圣王国が魔導国に使節団を送る章）；彼女は魔導国宰相として外交接見を主導。
  Cluster A+Bは連続した一場面（外交接見）。Cluster Cはアインズ独白のみ（skip）。

events:
  - event_id: YLDB-EV-V12-001
    source_line_range: [1949, 2136]
    event_type: face-to-face
    participants: [albedo, ainz, neia, remedios, gustavo]
    context: >
      圣王国使节团到访魔导国。雅儿贝德以宰相身份迎接，主导欢迎仪式→王座厅谒见→
      时间交涉→安兹强势定案→送客。全程通过外部人类（宁亚）视角描写。

    progress_timeline:
      - turn: 1
        speaker: albedo
        action: >
          以守护者总管/宰相身份迎接圣王国使节团：自我介绍职衔、慈悲微笑、主动允许使节
          带武器觐见（"因为我们信赖来自圣王国的各位"的心理操纵话术+透露对方武器对安兹
          毫无威胁的暗示），使个眼神指挥不死者收取其余人剑。全程外部视角观察为"完全
          看不出心里在想什么"、"全世界最与打斗无缘的美貌宰相"。
        emotional_state: >
          外表：完美的慈悲微笑（如天使下凡）；内在：不可知（外部POV）。唯一微泄：
          被问到武器时露出"觉得很有趣"的笑容——推测是对人类自以为构成威胁的蔑视性
          愉悦。
        attribution:
          layer_1_emotion: >
            外壳是慈悲恩赐感（武器化），内里可能是轻蔑的愉悦（"觉得很有趣"=对蝼蚁
            自以为有牙的好笑）
          layer_2_motivation: >
            执行外交设计：环境心理操纵（仪仗队+国旗+武器信任gambit）让使节团从一开始
            就在心理上处于接受恩惠的下位——与V10"层级宣示"同源
          layer_3_belief: >
            对人类态度（蔑视为低等/资源）+至尊中心主义（全场为安兹的登场铺台）
          layer_4_identity: >
            宰相=守护者总管的对外翻译，刻意不提"楼层守护者"等纳萨力克内部术语

      - turn: 2
        speaker: albedo
        action: >
          王座厅侧方待命，宣布"陛下即将莅临""安兹·乌尔·恭魔导王陛下入室""陛下已准，
          众人抬起头来"——仪式主持，纯角色职能执行。
        emotional_state: 不可知（外部POV，未描写她此时的表情变化）
        attribution:
          layer_1_emotion: 不可知
          layer_2_motivation: 守护者总管职责——仪式主持是她的组织功能
          layer_3_belief: 秩序观（等级结构天然合理性的具象化——典礼即秩序的展演）
          layer_4_identity: 守护者总管=宰相，仪式层面的核心执行者

      - turn: 3
        speaker: albedo
        action: >
          安兹询问"需要多久"，她回答五年（初始报价）。安兹追问缩短，她让步至三年
          （"我国可能会产生少许混乱"的成本声明）。安兹发出强势命令"我要你做"（两年），
          她肩膀微微颤抖后立即"遵命，陛下！"服从。安兹离场后，她"脸颊微微泛红，面带
          微笑"并温柔送客。
        emotional_state: >
          谈判阶段：冷静行政官模式（外部POV读为"宰相提供专业判断"）。收到强势命令瞬间：
          肩膀颤抖（宁亚读为任务压力之不安，但结合后续泛红微笑+profile知识，更可能是
          对安兹展示绝对权威的身体性回应）。安兹离场后：脸颊泛红+微笑=看到安兹的
          "绝对君主该有的声音"后的内在愉悦/兴奋的身体化泄露。
        attribution:
          layer_1_emotion: >
            表面冷静→收到命令时的身体性激动（颤抖）→安兹离场后的喜悦泛红——
            情绪弧线是"職業模式→安兹权威引发的正面身体回应→安全释放"
          layer_2_motivation: >
            时间谈判是预设剧本执行（迪米乌哥斯计划的一环，安兹假装让步让使节团感恩）；
            "遵命"是真实服从不是演的——安兹的命令无论是否剧本都会绝对执行
          layer_3_belief: >
            至尊中心主義（安兹下令=立即执行，无条件）+效忠排他性内化（安兹展示"绝对
            君主"的气魄本身就让她身体性满足）
          layer_4_identity: >
            在外人面前是"受命的宰相"；内在体验是"被安兹以绝对君主的声音下令"——
            后者才是颤抖和泛红的真实锚点
