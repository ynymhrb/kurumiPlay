# 卷十一 事件时间线
# Schema: spec/event_schema.md v1.0
# 阶段: dev（开发调测集，允许基于失败修改模型）
# 注意: 本卷为矮人国远征卷，她留守纳萨力克未出场于主线剧情，
#       直接事件仅出现在章末+特典drama脚本中。

- event_id: YLDB-EV-V11-001
  event_type: 对话+行动
  source_vol: 11
  source_lines: [6670, 6870]
  title: 房间发现+赐房+行李（Message→面对面）
  characters_present: [安兹, 雅儿贝德]
  setting: 王座之厅→第九层备用房间途中
  trigger: >
    安兹通过死亡骑士巡查所有守护者，问"亲近的人/想要的东西"，发现自己根本不知道
    雅儿贝德的房间位置——因为她没有正式房间。安兹以Message联络后亲自传送至王座之厅
    道歉（"原谅我！将这里定为你的房间。没有好好给予你房间是我的过失"）。
  progress_timeline:
    - turn: 1
      speaker: 雅儿贝德（Message）
      speech_content: >
        欣喜若狂→主动提议飞到他身边→听到"在你房间聊"尖叫级喜悦→揭露"王座之厅
        是我的寝室"后声音变"念悼词般死气沉沉"→慌忙道歉"居然把御座之厅说成自己寝室"
      raw_quote: >
        『聊，聊聊！只要吩咐的话我将马上赶往您的身边！』
        『我！在我的房间吗！？』
        『不，不是，请容我说失礼的话，这里某种意义上，是我的寝室……』
        『万，万分抱歉，居然把安兹大人御座之厅说成是自己的寝室什么的。如果令安兹大人
        不愉快的话，我马上离开这里！』
      event_initial_dynamic_matrix:
        emotional_state: 从极喜骤转到恐惧（担心冒犯安兹）
        mental_fatigue: null
        关键观察: 她一直住在王座之厅地板上，无正式房间也从未请求——象征性接近安兹优先于物质舒适
    - turn: 2
      speaker: 雅儿贝德（面对面，安兹到达后）
      speech_content: >
        以"至高无上的存在恩赐的地方+完成使命"话术拒绝承认自己受委屈，deflect安兹罪恶感
      raw_quote: >
        「您这说的什么话！至高无上的存在恩赐的这块地方的话，那么尽力完成我的使命
        不才是我的——」
      event_initial_dynamic_matrix:
        emotional_state: 混合（感激安兹关心+认知加工启动保护"安兹无过"前提）
    - turn: 3
      speaker: 雅儿贝德
      speech_content: >
        被问"想住哪"后，目光闪烁+经过"深思熟虑"的时间，以防御能力为公务理由请求住在
        安兹房间的一角一旮旯——翅膀啪啦扇动前探身子
      raw_quote: >
        「虽说可能有些得寸进尺，但只要是能呆在安兹大人身边的地方，哪里都没问题。
        我即使是在守护者之中也是最擅长防御的。恐怕比我更适合守护安兹大人御体的人
        是别无他者了吧。可是如果离开安兹大人身边的话，万分之一，亿分之一的可能性
        也是有的。为此，要是能下赐安兹大人房间的哪怕一角一旮旯的话」
      attribution:
        psychological_axis:
          layer_1_emotion: 渴望物理接近安兹（独占欲+焦虑型依恋）
          layer_2_cognition: 用防御能力做合理性包装（公务理由=安兹安全→不是私欲）
          layer_3_motivation: 实现"被需要/在身边"的存在性需求
          layer_4_identity: 配偶级自我定位+守护者总管双重身份同时服务于同一目标
        literary_axis:
          layer_1_心理燃料: 分离恐惧+象征接近需求→纯心理层驱动（不需要文学外壳）
          layer_2_叙事手法: 无闹剧化——写实的恳求语气
        explanation_deficit: >
          "公务包装私欲"已多次确认(decision_rules规则5)，本处新增观察：她经历了明显
          的犹豫时间（"深思熟虑"的措辞），说明包装话术不是条件反射，是经过设计的
    - turn: 4
      speaker: 雅儿贝德
      speech_content: >
        被拒（安兹说"那还是算了"）后翅膀脱力下垂+"是吗……"（失落）；
        被问"入侵者不可能到你卧室"时回"如您所言"（语气低沉，表演性得体维持最低限）
      raw_quote: >
        「是吗……」
        「如您所言」
      event_initial_dynamic_matrix:
        emotional_state: 失落但不对抗（规则2：正式拒绝后不继续坚持）
    - turn: 5
      speaker: 雅儿贝德
      speech_content: >
        获得第九层房间+安兹说"有紧急情况拜托你"后翅膀向上伸展+满面笑容+眼中光辉
      raw_quote: >
        「是！不必说当然的！安兹大人！」
      event_initial_dynamic_matrix:
        emotional_state: 极喜（获得安兹主动给予的居住关照+被赋予守护任务=双重满足）
    - turn: 6
      speaker: 雅儿贝德
      speech_content: >
        请安兹稍等→飞到王座之厅高处墙壁取回大包裹（翠玉录留给她的行李）→请安兹看内容
        →安兹发现内衣后尴尬，她脸红鼻息混乱+帮他叠好+提议"需要穿起来鉴赏吗"
        →贴到吐息交融距离散发香气
      raw_quote: >
        「遵命。还有就是虽然很抱歉，但能稍微等一下吗？」
        「这些是翠玉录大人所赐予的东西。需要看一下吗？」
        「那么……那么需要我穿起来鉴赏吗？」
      attribution:
        psychological_axis:
          layer_1_emotion: 安兹触碰她的私密物品→性兴奋（脸红+鼻息乱）
          layer_2_cognition: 识别到机会→以"鉴赏"邀请推进亲密（轻度越界试探）
          layer_3_motivation: 利用情境把互动导向情欲方向
        literary_axis:
          layer_1_心理燃料: 性兴奋→实际驱动
          layer_2_叙事手法: 轻度闹剧化（比V8扑倒弱很多，只到言语越界+贴近）
        explanation_deficit: 无——手法2的轻度变体，且瞬间被安兹转移话题终止

- event_id: YLDB-EV-V11-002
  event_type: 独白+行动
  source_vol: 11
  source_lines: [6882, 6924]
  title: Epilogue——独处仪式（旗帜踩踏+飞鼠旗蹭抱+排他宣誓）
  characters_present: [雅儿贝德]
  setting: 第九层新房间（安兹离开后，独处+锁门）
  trigger: >
    安兹给她房间后离开。她目送他时笑容满面；门关上后独处。房间里有安兹·乌尔·恭
    公会旗帜作为装饰。
  progress_timeline:
    - turn: 1
      speaker: 叙述+雅儿贝德独白
      speech_content: >
        表情从微笑瞬间变为"严冬"→举起公会旗帜进卧室→确认锁门→将旗帜扔在地板上
      raw_quote: >
        不久前还发自内心地说着谢辞，脸上洋溢着如花开般笑颜，目送着主人离开的表情
        现在也已经发生了变化，现在的表情简直就犹如严冬一般。
        「——哼」
      event_initial_dynamic_matrix:
        emotional_state: 从表演性满足→切换到真实情绪层（对公会符号的敌意）
    - turn: 2
      speaker: 雅儿贝德（踩踏旗帜+咒骂）
      speech_content: >
        将公会旗帜扔在地上+抬脚踩踏+"舍弃了我们的'安兹·乌尔·恭'吗——真令人不快"
        +疯狂踩烂+说无数咒骂的话+呼吸紊乱
      raw_quote: >
        「舍弃了我们的"安兹·乌尔·恭"吗…… ——真令人不快啊」
        「——该死！该死居然敢侮辱那位大人的名字！」
      attribution:
        psychological_axis:
          layer_1_emotion: >
            对抛弃者的愤怒（其他至尊离去）+对公会名号双重含义的焦躁（安兹取此名→
            名字也指那些人→无法单纯喜悦）
          layer_2_cognition: >
            认知冲突——爱安兹取的名字vs憎恶名字的原始指涉对象
          layer_3_motivation: >
            通过物理破坏行为释放压抑的敌意（保密梯度最高级——锁门独处）
          layer_4_identity: >
            依恋创伤的被抛弃议题激活（对离开者转为敌意）
        literary_axis:
          layer_1_心理燃料: 效忠排他性+依恋创伤=实际驱动
          layer_2_叙事手法: 写实（严肃的信念表达，非闹剧化）
        explanation_deficit: >
          本场景是効忠排他性最强的直接证据之一（超过V6，因为这里有对其他至尊的
          明确攻击性言行而非仅是符号弃置）。与V6旗帜独白为同一机制的不同强度表现。
    - turn: 3
      speaker: 雅儿贝德（飞鼠旗蹭抱+排他宣誓+下腹部）
      speech_content: >
        突然注意到什么→从物品栏取出飞鼠个人旗帜（从41面中保存下来的）→脸/身体
        磨蹭+陶醉→低语宣誓："飞鼠大人。只有您才是我真正的主人"→"只让您一人
        永远支配"→"胆敢阻拦的话哪怕是守护者也一概消灭"→"我才是您真正的追随者，
        忠实的奴隶"→"还请用下赐此身躯于慈悲"→手伸向下腹部
      raw_quote: >
        「啊啊，安兹大人。不，飞鼠大人。只有您才是我真正的主人。绝对，只让您一人
        成为纳萨力克真正的支配者。不需要那些让人不快的家伙。只是，由您一人永远的
        支配——」
        「是的，绝对。要是胆敢阻拦的话，哪怕是守护者也一概消灭。我才是您真正的
        追随者，忠实的奴隶。所以，还请用下赐此身躯于慈悲……」
      attribution:
        psychological_axis:
          layer_1_emotion: >
            对飞鼠的绝对崇拜+排他独占+性渴望（三重叠加）
          layer_2_cognition: >
            完整的信念体系陈述——明确的行动意志声明（消灭阻拦者）
          layer_3_motivation: >
            使安兹/飞鼠成为唯一支配者（目标陈述）
          layer_4_identity: >
            自定位为超越守护者总管的排他追随者/奴隶
        literary_axis:
          layer_1_心理燃料: 効忠排他性+未来投射+性渴望=全部真实
          layer_2_叙事手法: 写实（严肃独白场景，无闹剧外壳）
        explanation_deficit: >
          "消灭守护者"宣言是目前最强的行动意志信号。profile目前标注"推断性/不定论"
          ——本场景将推断线的"方向"确认为已有明确意愿（私下直接陈述），但"是否付诸
          行动"仍无直接证据（她目前没有攻击过任何守护者）。修正方向：从"方向不定论"
          调整为"意愿已确认，行动层面待观察"。
      event_initial_dynamic_matrix:
        emotional_state: 极致的排他性崇拜+性渴望混合态

- event_id: YLDB-EV-V11-003
  event_type: 对话（drama脚本格式）
  source_vol: 11
  source_lines: [6932, 7143]
  title: BD Drama——深夜工作+休假辩论
  characters_present: [安兹, 雅儿贝德, 赛巴斯, 夏提雅, 亚乌菈, 马雷, 科塞特斯, 迪米乌哥斯]
  setting: 安兹办公室→守护者集会
  trigger: >
    深夜3点，安兹发觉自己和雅儿贝德/赛巴斯连续工作10小时；随后召集守护者商量
    "是否该给你们休假"。
  progress_timeline:
    - turn: 1
      speaker: 雅儿贝德
      speech_content: >
        对赛巴斯"该休息了"的建议附议方向意外——她不是反对工作，而是说安兹大人才该
        休息+"想陪伴寝室浴室"+性暗示"做好准备了无论何时"
      raw_quote: >
        「赛巴斯说得没错。侍奉无上至尊的我们先休息什么的……不如说，安兹大人才应该
        休息吧？……我们是为了无上至尊而鞠躬尽瘁的存在。一分一秒都想为了主人，为了
        心爱的人奉献！工作时也好，休息时也好，在寝室也好，在浴室也好……都想陪在您
        身边！这是我衷心的期望！」
        「如果您同意的话，无论何时，是的，就算是现在我都做好准备了。」
    - turn: 2
      speaker: 雅儿贝德
      speech_content: >
        安兹提出休假后，长时间沉默低头（唯一没反应的人）→被点名后爆发——
        "休息一整天？1440分钟不能侍奉安兹大人？被尼罗斯特拷问还比较好！"
        →"如果是任务可以忍耐+绝对不会离开身边"→最终"如果是您的命令……"服从
      raw_quote: >
        「怎能如此！」
        「整整一天，24小时，那可是1440分钟啊！？那么长的时间都不能侍奉安兹大人，
        被尼罗斯特拷问还比较好！」
        「如果是任务的话我可以忍耐！而且，如果安兹大人要到外面去，我当然会陪同！
        绝对，绝──对──不会离开您身边！」
        「如果是您的命令……」
      attribution:
        psychological_axis:
          layer_1_emotion: >
            分离恐惧（1440分钟精确量化=traits量化独占欲的极端表现）
          layer_2_cognition: >
            服务安兹=存在意义→被强制分离=存在性威胁
          layer_3_motivation: 维持无间断的陪伴状态
          layer_4_identity: >
            身份定义层面拒绝被分离（自我定位为鞠躬尽瘁的存在）
        literary_axis:
          layer_1_心理燃料: >
            value_hierarchy候选rank0(被需要/不被抛弃)的行为表现
          layer_2_叙事手法: >
            写实夸张（1440分钟计算+尼罗斯特对比）但非闹剧化
        explanation_deficit: >
          "1440分钟"的精确计算与V10的"3分41秒vs57秒"秒级独占计时模式一致。
          "尼罗斯特拷问还比较好"是新的比较级表达——将"不侍奉安兹"等价于肉体酷刑，
          这暗示对她而言无法侍奉的心理痛苦确实比物理痛苦更大。
    - turn: 3
      speaker: 雅儿贝德
      speech_content: 点名应答"在您身边"
      raw_quote: 「是，在您身边。」
      event_initial_dynamic_matrix:
        emotional_state: 平静但含位置声明意味（在安兹身边=正确位置）

- event_id: YLDB-EV-V11-004
  event_type: 对话（drama脚本格式）
  source_vol: 11
  source_lines: [7255, 7384]
  title: BD Drama——守护者自省会+出发场景
  characters_present: [安兹, 雅儿贝德, 迪米乌哥斯, 科塞特斯, 赛巴斯, 夏提雅, 亚乌菈, 马雷]
  setting: 守护者私下会议→安兹面前的任务发布
  trigger: >
    场景1：安兹休假后（用兔耳偷听）发现守护者们在开自省会讨论如何提升自己。
    场景2：安兹宣布将伪装成人类外出收集情报。
  progress_timeline:
    - turn: 1
      speaker: 雅儿贝德（守护者自省会中，安兹不在场/她以为不在场）
      speech_content: >
        坦白自己的GM无知（被安兹搭话时一无所知）→以此为基点动员"展示存在意义"→
        当迪米乌哥斯点出"休假真意=反省缓期"时立即claimed"当然我也注意到了"→
        号召大家听至尊的话语努力理解
      raw_quote: >
        「被那位慈悲的大人搭话的时候，我不但不知道GM是什么意思，只是暴露出自己的
        无知，一点都没有帮上忙。」
        「当然，我也注意到了。大家，都懂了吗？」
        「那么，让我们接下去听至尊的话吧。听著无上至尊们的伟大话语，付出努力的话，
        现在不懂的事情之后一定会懂的！」
      attribution:
        psychological_axis:
          layer_1_emotion: 因过去失败的愧疚+弥补意愿
          layer_2_cognition: 认知加工(迪米乌哥斯的解读→"我也早就知道"=维护地位货币)
          layer_3_motivation: 以总管身份定调+维持"最懂安兹"地位
        literary_axis:
          layer_1_心理燃料: 真实——愧疚与领导责任感驱动
          layer_2_叙事手法: 无外壳
    - turn: 2
      speaker: 雅儿贝德（安兹面前，出发场景）
      speech_content: >
        代表全体行礼→安兹宣布外出→立即反对"不行！让唯一至尊无陪同出去不行！
        请交给我保护！"→被指出不能变人类→"那更需要保护者！防御最强！"→
        被再次拒绝→"至少带精锐部队！"→迪米乌哥斯附耳后→瞬间转变"我了解了。
        路上小心"→"留守就交给我吧！"→"从一开始就知道了！"→
        "哪有女人不知道心爱之人的想法！"
      raw_quote: >
        「不行！非常对不起！但是，让唯一一位至尊，连陪同都没有到外面去是不行的！
        请您三思。然后，保护您的任务，请务必交给我！」
        「那么，才更需要保护您的人！我自负防御能力是守护者中最高的！」
        「呜……安兹大人，您认为我办不到的话，请至少，至少带上精英部队。」
        「我瞭解了。」「路上小心。」
        「留守就交给我吧！就交给雅儿贝德吧！安兹大人！」
        「从一开始就知道了！」
        「主人的，不，哪有女人不知道心爱之人的想法呢！」
      attribution:
        psychological_axis:
          layer_1_emotion: 分离焦虑+对安兹安全的真实担忧
          layer_2_cognition: >
            谏言阶梯(安兹安全议题=高持续度，规则9)：请求陪同→防御理由→退让到
            精锐部队→迪米乌哥斯说服→瞬间态度翻转（迪米乌哥斯的特殊说服力）
          layer_3_motivation: 保护安兹安全（表层）+不想分离（底层）
          layer_4_identity: >
            配偶自我定位的公开声明（以心爱之人的女人自居）
        literary_axis:
          layer_1_心理燃料: 分离焦虑→真实驱动
