        卷一实例为逐字复诵；卷六实例（YLDB-EV-V6-001）为复述命令目标+主动追加扩展承诺
        （"遵命！救出此人的同时，我也会严惩触怒安兹大人的那些人类！"）——从"逐字复诵"
        重命名为更宽的"复述确认"，两种形态都算，逐字/扩展是子变体
    - phrase: 谏言前先请罪自贬（"请原谅我……的愚蠢行径"类开场）
