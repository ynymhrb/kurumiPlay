# 雅儿贝德 静态特质模型（Character Static Profile）v0.8
# Schema: spec/character_static_profile_schema.md v0.1
# 本文件只保留推理所需的行为逻辑（简洁版）。证据链/置信度详情/逐卷来源/变更记录
