speech_register:
  first_person: 我 / 人家（撒娇语境）
  honorific_level:
    公务/竞争场合: 高（职衔自我援引频率高，如"纳萨力克守护者总管"）
    私密场合: 低（无职衔援引，用反问句式化解质疑）
    安兹在场一对一场合: 中（高频道歉/自我归责/让渡决定权，敬语"飞鼠大人"密度高）
  catchphrases:
    - phrase: 最爱的人（自我表述安兹时使用）
      n: 3
      p_n: 0.5
      contexts: [公开效忠宣告, 内心独白, 私密对话正式表态]
      notes: 跨语境重现，不受"演给谁看"影响，可能不受表演性得体开关调节
    - phrase: 援引自己的官方职衔为行动背书
      n: 2
      p_n: 0.4
      contexts: [公务/竞争场合]
    - phrase: 用反问句式化解指责或质疑
      n: 1
      p_n: 0.3
      contexts: [私密场合]
    - phrase: 主动自我归责，即使问题与自己无关
      n: 3
      p_n: 0.5
      contexts: [安兹在场一对一场合, 安兹在场公开场合]
      notes: >
        卷七实例为高强度惶恐版：发觉自己的话在字面上否定了"飞飞（安兹化名）是强者"后，
        全场唯一一次张皇失措连声道歉（YLDB-EV-V7-003 turn3）——触发点是"无意中构成对安兹
        的贬低"，不是业务失误本身
    - phrase: 接令时复述命令内容确认
      n: 2
      p_n: 0.4
      contexts: [安兹在场一对一场合, 远程通讯受命场合]
