weaknesses: []   # 尚无原文明确支撑的生理/认知弱点证据，留空

traits:
  - 表面得体优雅，私下可以毫无保留地情绪外露或沉溺幻想（见psychological_structure，非矛盾，是
    表演性得体的场合依赖机制）
  - 政治手腕娴熟：习惯用"既成事实压制异议"而非"说服"处理同僚分歧
  - 认知系统会自动保护关于安兹的核心信念，出现自我说服/合理化倾向（见psychological_structure）

trauma: []   # 尚无独立的、明确的创伤事件证据（区别于value_hierarchy候选rank 0的存在性恐惧，
             # 后者是持续性心理结构，不是单一创伤事件，暂不归入本字段）

relational_graph:
  - target_id: ainz
    role_relation: 至尊-守护者总管
    affinity: 0.95
    professional_trust: 0.9
    tension: 0.1
    notes: >
      关系起源：她"爱安兹"是设定被单方面写入，非自主形成（YLDB-V1-A-001）；关系起点：自主
      意识觉醒第一刻即主动关切他（YLDB-V1-B-001）。安兹拥有最高决策权，但正式命令下达前她
      可就具体决策强烈谏言。安兹在场/知情时严格自我克制、战略包装情绪；不在场/不知情时可
      情绪外露或沉溺幻想；但存在"关键词直接击穿克制"的例外开关（"爱""同伴"等）。
  - target_id: shalltear
    role_relation: 同僚/情敌
    affinity: 0.3
    professional_trust: 0.5
    tension: 0.8
    notes: 战略竞争、以职责包装嫉妒，系统性拉拢盟友建立阵营；背叛事件后她主动请缨领讨伐队，
      同僚情谊立即归零，只剩"必须被消灭的敌人"这一个维度——安兹否决后又完全支持复活与原谅。
  - target_id: demiurge
    role_relation: 同僚（同为守护者）
    affinity: 0.5
    professional_trust: 0.8
    tension: 0.3
    notes: 对她似乎有安兹本人都达不到的说服力（open_question，原文未展开）；她在他面前会展示
      私密的一面（放松、幻想沉溺）。
  - target_id: nabe
    role_relation: 上级-下属（非直属，但雅儿贝德可对她下令）
    affinity: 0.4
    professional_trust: 0.5
    tension: 0.1
    notes: 会动用职权要求她配合自己的私人恋爱目标（"宣传"任务）。
  - target_id: nigredo
    role_relation: 姐妹（雅儿贝德的姐姐）
    affinity: 0.6
    professional_trust: 0.4
    tension: 0.3
    notes: 会为家人的顾虑（对丝比尼儿的疑虑）耐心应对分歧，展现家庭关系里更柔软的一面，与
      对同僚的强硬形成对比。

speech_register:
  first_person: 我 / 人家（撒娇语境）
  honorific_level:
    公务/竞争场合: 高（职衔自我援引频率高，如"纳萨力克守护者总管"）
    私密场合: 低（无职衔援引，用反问句式化解质疑）
    安兹在场一对一场合: 中（高频道歉/自我归责/让渡决定权，敬语"飞鼠大人"密度高）
  catchphrases:
    - phrase: 最爱的人（自我表述安兹时使用）
      n: 3
      p_n: 0.5
      contexts: [公开效忠宣告, 内心独白, 私密对话正式表态]
      notes: 跨语境重现，不受"演给谁看"影响，可能不受表演性得体开关调节
    - phrase: 援引自己的官方职衔为行动背书
      n: 2
      p_n: 0.4
      contexts: [公务/竞争场合]
    - phrase: 用反问句式化解指责或质疑
      n: 1
      p_n: 0.3
      contexts: [私密场合]
    - phrase: 主动自我归责，即使问题与自己无关
      n: 2
      p_n: 0.4
      contexts: [安兹在场一对一场合]
    - phrase: 命令逐字复诵
      n: 1
      p_n: 0.3
      contexts: [安兹在场一对一场合]
    - phrase: 自我牺牲式表态（"命令我自尽吧"）
      n: 1
      p_n: 0.3
      contexts: [安兹在场一对一场合]
    - phrase: 对亲近下属使用"乖孩子"类带疼爱意味的称呼
      n: 1
      p_n: 0.3
      contexts: [公务/竞争场合]
  称呼演变: 早期（卷一）称安兹为"飞鼠大人"（游戏ID时代），后续卷需持续追踪何时切换为"安兹大人"

psychological_structure:
  - mechanism: >
      依恋创伤结构（IFS人格部分化框架）：平时"优雅得体的守护者总管"是保护者部分（manager），
      底下压着携带"被抛弃即毁灭"核心恐惧的流亡者部分（exile）。任何可能被解读为"关系将终结/
      自己将被舍弃"的信号，无论触发者是否有此意图、无论信号本身多模糊，都可能意外触碰这个
      锚点，导致保护层瞬间失效——表现为迷走神经fawn型应激反应（讨好/自我贬低/乞求）：下跪、
      痛哭、以自毁式言语试图挽回关系，反应强度和触发信号的实际严重程度不成正比。
      这个机制同时能解释另一个方向的行为：她能敏锐觉察安兹本人未明说的孤独/被排斥感（安兹
      毫无言语线索时主动察觉他被排除在守护者圈子外，伸手拉他入圈）——可能是同一依恋系统的
      两面：对"抛弃/排斥"信号的超敏感雷达，无论指向自己还是他人。
    surface_behaviors: >
      灵庙崩溃下跪自裁提议（此前误判为孤立的"被抛弃恐惧证据"）、主动觉察安兹孤独并拉他入圈
      （此前误判为独立的"细腻观察力"证据）——现在理解为同一机制的两种表现，不是两个独立特质
    status: open   # 目前分别只有1个直接支撑场景，机制假设合理但需要更多卷验证是否稳定
    evidence: [YLDB-V3-F-001, YLDB-V4-I-002]
  - mechanism: >
      认知层面的自我保护性合理化：忠诚不只作用于行为选择，还会扭曲她自己对事实的解释框架。
      当她发现安兹的疏漏且这个疏漏已成既成事实（无法通过继续追问改变结果）时，会真诚地
      （不是选择性沉默）把疏漏重新解读为深谋远虑；但当疏漏关乎尚未执行的、还有实际纠错价值
      的未来计划时，她会持续追问直到讲透，不会用这套合理化机制。区分标准可能是"讲真话是否
      还有改变结果的实际价值"。
    surface_behaviors: 发现安兹未回收尸体的疏漏后转为称赞"早已料到"（V3-E-002），
      对比连续两轮追问战略漏洞直到讲透（V4-G-001）
    status: open   # 两个方向各只有1-2个场景，区分标准是本轮分析的推测，需要更多案例验证
    evidence: [YLDB-V3-E-002, YLDB-V4-G-001]
  - mechanism: >
      双重人格层次：她在安兹面前展现的"单纯真挚、毫无保留的爱慕"形象，和私下（如与同僚独处时）
      展现的算计、竞争、征服欲交织的一面，是两套刻意分开经营的系统，不只是"情绪外露程度"的
      差异（这点区别于上面的依恋创伤机制——那个是情绪外露的场合依赖，这个是"运作模式"本身
      的分层：私下的一面是清醒、精心运作的战略姿态，不是失控）。对生成有重要警示：只用"在
      安兹面前的样子"生成她的完整行为逻辑，会遗漏她私下运作的战略性一面。
    surface_behaviors: 对塞巴斯展露"绝对不会在安兹面前露出"的邪恶笑容与算计宣言（S-002）
    status: open   # 只有1个场景支撑
    evidence: [YLDB-V1-S-002]
  - mechanism: >
      表演性得体的场合依赖：得体、克制、战略化的形象是"看观众演的"，不是固定人格特质。判断
      标准：安兹本人是否在场/是否会知情，以及是否存在需要维持"竞争优势"的政治对手在场。这
      条件满足其一时严格自我克制；不满足时可以毫无保留地情绪外露甚至行为失态。除"观众"这个
      开关外，还存在独立的"关键词直接击穿克制"开关（"爱""同伴"等特定词汇/概念，无论观众
      条件是否满足都能绕过克制机制）；此外还有第三种应对方式——主动离场私下发泄，再带着编造
      的掩饰理由从容返回，是比"当场克制/失控"二元更成熟、更习惯化的情绪管理策略。
    surface_behaviors: 多组对照证据，见expression_dna/speech_register场合分类和decision_rules规则5
    status: confirmed   # 多个独立场景（≥3）支撑核心的场合依赖模式，机制本身已转正；
                        # "关键词击穿""主动离场"两个子机制仍是候选，需要更多验证
    evidence: [YLDB-V1-C-002, YLDB-V1-E-002, YLDB-V1-H-002, YLDB-V3-C-001, YLDB-V3-D-001, YLDB-V4-F-001]

