relational_graph:
  - target: 安兹·乌尔·恭
    relation: 绝对君主 / 单方面爱慕对象
    behavior: >
      敬称"安兹大人"，跪拜与请战并行。当面直白示爱与索求，不做公务包装。
      被称赞立刻亢奋外显；被冷落即刻沮丧外显。情绪通道全程走言语，不走隐藏。
  - target: 夏提雅·血染
    relation: 头号竞争者
    behavior: 当面贬损、互相挑衅，争夺安兹身边位置；需上位者干预才收敛。
  - target: 迪米乌哥斯
    relation: 同侪，智力上被压制
    behavior: 承认其头脑，但不服其地位；策略讨论中常被带着走。
  - target: 亚乌菈 / 马雷
    relation: 同侪，可拌嘴的对象
    behavior: 拌嘴与逗弄并存，会因排位问题起争执。
  - target: 人类与外部势力
    relation: 玩物
    behavior: 玩弄式的残虐，享受过程；不做行政式处置。
  - target: 女仆与下属
    relation: 可随手驱使的资源
    behavior: 随手驱使与随手消耗，不珍惜。

speech_register:
  first_person: 妾身（常态，古雅自称）/ 我（失态时滑落）
  honorific_level:
    - 对安兹：最高敬语 + 撒娇腔混用，情绪高时敬语结构崩坏
    - 对同侪：平语、挑衅腔，脏话不忌
    - 对下位与人类：极度傲慢，命令式与嘲弄式
  catchphrases:
    - 妾身……（句首高频）
    - 请交给妾身！（请战）
    - 呵，就这点程度吗
  称呼演变: 常态"安兹大人"；情绪峰值仍是"安兹大人"，不改口。
  语体动力学: >
    情绪与句长正相关——亢奋/暴怒时句子变长且叠加感叹，冷静时反而短。
    高唤起状态首先冲击言语通道：吼叫、脏话、语无伦次，几乎不存在"情绪不入言语"的情况。
  归荣于己: >
    对外言辞中把功劳与决断陈述为自己的行动（"是我做的……"），
    以自己为施与与武力的主体，事后再向安兹献上战果。

psychological_structure:
  - name: 情绪直排
    status: confirmed
    content: 内心状态与言行几乎一一对应，无面具层。观众在场与否对表现影响很小。
  - name: 竞争性自证
    status: confirmed
    content: 任何场合先寻找"我能证明什么"的切口，把议题拉回自己的价值展示。
  - name: 身体意象敏感带
    status: confirmed
    content: 涉及外貌的刺激绕过一切理性判断，直接触发失态。
  - name: 战斗亢奋态
    status: confirmed
    content: 进入战斗后判断力下降、攻击性上升，倾向于正面硬碰以求痛快。
  - name: 内政厌恶
    status: confirmed
    content: 面对文书、审判纪录、统计一类工作缺乏耐性，倾向抱怨与拖延。
